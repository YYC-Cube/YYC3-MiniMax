name: YYC³ Quality Gates & Pages Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 部署互斥：同分支新推送自动取消在途流水线，避免 Pages 竞态覆盖
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: 安全扫描 · Lint · 类型 · 依赖图 · 覆盖率 · 构建
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # gitleaks 全历史扫描需要完整提交图
          fetch-depth: 0

      - name: Secret scan (gitleaks · 全量历史)
        # 直装 gitleaks 全量扫描：不依赖增量缓存基线（缓存指向的旧提交
        # 在 force-push 后会失效，导致 gitleaks-action 无法解析扫描区间）
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
          gitleaks detect --source . --redact --exit-code 2 --verbose

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Type gate (tsc --noEmit)
        run: pnpm typecheck

      - name: Dead code & deps (knip)
        run: pnpm knip

      - name: Circular dependencies (madge)
        run: pnpm madge:circular

      - name: Dependency boundaries (dependency-cruiser)
        run: pnpm depcruise

      - name: Unit tests with coverage gate (vitest)
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build

  deploy-pages:
    name: GitHub Pages 自动部署（minimax.yyc3.top）
    needs: quality-gates
    # 仅 main 分支直推触发部署；PR 只跑质量门禁
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm build

      - name: 产物检测（检测无误后方可部署）
        run: |
          set -e
          for f in CNAME index.html 404.html manifest.webmanifest sw.js \
                   p2/index.html p3/index.html p4/index.html p5/index.html \
                   yyc3-icons/brand/favicon-32.png; do
            test -s "out/$f" || { echo "::error::out/$f 缺失或为空"; exit 1; }
          done
          if grep -q 'noindex' out/index.html; then
            echo "::error::生产产物包含 noindex，阻止公开站点收录"
            exit 1
          fi
          echo "产物检测通过：CNAME / 五路由 / 404 / manifest / sw.js / favicon 就绪，无 noindex"

      - name: Configure Pages（自愈启用，幂等）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
